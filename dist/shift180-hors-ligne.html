36:{t:`<div class="keepnote">🎯 Spread et rest : le même trois-points, deux rôles exactement opposés.</div>
<h3>1. Spread (éparer) : EXPLOSE un iterabile</h3>
<pre><code>const src = ['a', 'b'];
const copie = [...src, 'c'];               // copie non liée
Math.max(...[3, 9, 2]);
const fusion = { ...objA, ...objB, priorite: 2 }; // objets en 1 ligne</code></pre>
<ul><li>copie « shallow » : les objets internes restent partagés — attention aux envages profonds.</li></ul>
<h3>2. Rest (re récupérer) : COMPACTE le surplus</h3>
<pre><code>function logArgs(...args) { args.forEach(console.log); }
const { nom, ...reste } = dev;      // reste = ce qui reste
const [prem, ...queue] = tableau;</code></pre>
<h3>3. Où donc ça bouche des trous</h3>
<table><tr><th>Besoin</th><th>Fait par</th></tr>
<tr><td>Mettre à jour un objet sans le muter</td><td><code>{ ...state, user: nouveau }</code></td>
<tr><td>Un nb flexible d'arguments</td><td><code>(...checks) =&gt; checks.every(Boolean)</code></td></tr>
<tr><td>Enlever une clé proprement</td><td><code>const { motDePasse, ...public } = user;</code></td></tr></table>
<div class="keepnote">💡 Garde en tête : à gauche du signe = : rest (assembler). À droite : spread (étaler). Le sens se lit dans la direction de la donnée.</div>`,
s:`const { solde, ...pub } = { solde: 100, nom: 'A', mail: 'b@c' };\nconsole.log(pub);\nconst merge = { ...{ a: 1 }, ...{ a: 2, b: 3 } };  /* le dernier gagne */\nconsole.log(merge, ...[1, 2, 3]);`,
x:['Copie defensive d\'un tableau, changer la copie, l\'original intact','Fusionner global par défaut + options utilisateur (options || defaut)','Une fonction (...args) qui log chaque arg','Nettoyer documenté { motDePasse, ...public } : reste exactly']},
37:{t:`<div class="keepnote">🎯 Callbacks : la base de tout. Même son valid ation de livraison : une fonction qu'on DONNE pour qu'on l'appelle plus tard.</div>
<h3>1. Le principe</h3>
<pre><code>function traite(liste, cb) {
  for (const x of liste) { const v = cb(x); console.log(v); }
}
traite([1, 2], x =&gt; x * 10);</code></pre>
<p>Une fonction QUI REÇOIT une fonction — la plus grande valeur du paramétrage moderne.</p>
<h3>2. Sync vs async callbacks</h3>
<ul><li><b>Synchrone</b> : la callback s'appelle immédiatement (map, filter, sort).</li>
<li><b>Asynchrone</b> : appelée PLUS TARD (setTimeout, événements, fetch …). continue aujourd'hui avec setTimeout : la promesse du porte-futur.</li></ul>
<h3>3. Le piège des callbacks imbriqués</h3>
<pre><code>etape1(etape2(etape3(...)))    //  « pyramide de l'horreur »</code></pre>
<p>C'est la DOULEUR qui a fait naitre promises (J38) — cette naissance të motiv la révolution JS.</p>
<h3>4. setTimeout / setInterval</h3>
<pre><code>const id = setTimeout(() =&gt; console.log('là, 2s plus tard'), 2000);
clearInterval(id);   // annuler un compte à rebours ou une répétition</code></pre>
<div class="keepnote">💡 Garde en tête : Whenever tu passes un callback, demande-toi : « qui l'appelle, avec quoi, quand ? ». C'est le contrat caché derrière chaque API JS.</div>`,
s:`setTimeout(() => console.log('+ 1s'), 1000);\nconst rot = setInterval(() => console.log('tick'), 500);\nsetTimeout(() => { clearInterval(rot); console.log('stop'); }, 3000);`,
x:['Un callback simple synchrone via map','setTimeout chainés : 3 messages successifs','setInterval + clear via un setTimeout externe','Réécrire un bloc imbré « pyramide » : compter le nombre de niveaux']},
38:{t:`<div class="keepnote">🎯 Promises : une journée-clé. LE modèle de résultat future du JS. C'est ici que le code client devient industriel.</div>
<h3>1. Le modèle en 2 lignes</h3>
<p>Une Promise = un <b>ticket de file d'attente</b>. Trois états : <code>pending</code> → <code>fulfilled</code> (OK) ou <code>rejected</code> (erreur). Une fois forcée, l'état ne change plus.</p>
<pre><code>const prom = fetch('/api');  // ex. pre
prom.then(r =&gt; r.json()).then(d =&gt; console.log(d))
    .catch(e =&gt; console.error(e));</code></pre>
<h3>2. Le chainage</h3>
<p><code>then</code> retourne TOUJOURS une nouvelle promise — d'où les chaînes plates (<code>then.then.catch</code>). Retourner une valeur la met dans la suite ; lever une throw va au <code>catch</code> le plus proche.</p>
<h3>3. Des proms existantes & composer</h3>
<pre><code>Promise.resolve(1); Promise.reject('trop tard');
Promise.all([p1, p2]);    // attend TOUT ou un seul échec
Promise.race([p1, p2]);   // le premier qui fini
Promise.allSettled([..]); dedans les états, même en échec</code></pre>
<h3>4. Promise nouvelle</h3>
<pre><code>const p = new Promise((resolve, reject) =&gt; setTimeout(() =&gt; resolve('ok'), 500));</code></pre>
<div class="keepnote">💡 Garde en tête : sans <code>catch</code>, une erreur asynchrone part en silence (console de promesse distractrice). Règle pro : chaque chaîne asynchrone finit par <code>.catch</code>.</div>`,
s:`const p = new Promise(res => setTimeout(() => res('livre après 800ms'), 800));\np.then(x => 'j\'ai reçu ' + x)\n .then(y => console.log(y))\n .catch(e => console.error('raté', e));`,
x:['Une promise resolve après 800ms puis chainée 2×','Un reject attrapé via catch (erreurs async)','Promise.all sur 2 settle simultanés','Sans catch : lever l\'erreur et noter le unhandledrejection en console']},
39:{t:`<div class="keepnote">🎯 async/await : la même promesse par la lecture séquentielle. Le code devient une histoire droite.</div>
<h3>1. La paire</h3>
<pre><code>async function route() {
  try {
    const r = await fetch('/api/data');     /* pause propre */
    const d = await r.json();
    return d;
  } catch (e) {
    console.error('chaîne ratée', e);
  }
}</code></pre>
<ul><li><code>await</code> pause LA FONCTION (not the thread), effacement ligne par ligne.</li>
<li><code>async</code> toujours retourne une Promise.</li></ul>
<h3>2. En parallèle : Promise.all reste l'outil</h3>
<pre><code>const [users, posts] = await Promise.all([fetchU(), fetchP()]);</code></pre>
<p><b>Erreur fréquente</b> : <code>await</code> séquentiel sur 2 requêtes indépendantes = 2× le temps. Le parallèle « Promise.all » connaître comme réflexe.</p>
<h3>3. await sur top-level</h3>
<p>Dans les modules modernes on peut awaiter hors fonction. Dans une plateforme comme PBD on entoure dans une async main() — compare avec la version du code de ce site.</p>
<div class="keepnote">💡 Garde en tête : await emboîte try/catch comme les fonctions normales. <b>Un await sans try/catch est une promesse non tenue</b> — ton catch est le filet.</div>`,
s:`async function routeList() {\n  try {\n    const r = await fetch('https://api.github.com/users/emmanuel-bilombo/repos?per_page=2');\n    const d = await r.json();\n    console.log(d.map(x => x.full_name));\n  } catch (e) { console.error('réseau/ erreur', e); }\n}\nrouteList();`,
x:['async fetch simple + erreurs via try/catch','Promise.all sur 2 fetches : comparer les temps','Un await sans try : observer unhandledrejection','Écrire une async fonction qui échoue et autorise une valeur par défaut']},
40:{t:`<div class="keepnote">🎯 Erreurs : un code pro c'est un code qui ÉCHECISANT PROPREMENT. Aujourd'hui, on fait du filet.</div>
<h3>1. Le trio throw/try/catch/finally</h3>
<pre><code>function retirer(compte, mont) {
  if (mont &gt; compte.solde) throw new Error('Solde insuffisant');
  compte.solde -= mont;
}
try { retirer(c, 999); }
catch (e) { console.error(e.message); }
finally { toast('Opération tentative'); }</code></pre>
<ul><li><code>finally</code> tourne quitte, succès ou échec : le nettoyage garanti (loader off, file fermée...).</li>
<li><code>Error('msg')</code> : un objet (message, stack) — throw d'une string fonctionne mais perd la trace.</li></ul>
<h3>2. Personnaliser : susclasse d'erreurs</h3>
<pre><code>class SoldeError extends Error { constructor(m) { super(m); this.name = 'SoldeError'; } }</code></pre>
<p>Un catch qui fait <code>if (e instanceof SoldeError)…</code> — polyvalent dans une app réelle. Su versus les string default = révision complète du jour 29.</p>
<h3>3. UX : l'utilisateur n'est pas un dev</h3>
<ul><li>Toast « Il yap problème, réessaie ; détail technique hideux (console.error) pour toi ».</li>
<li>Validate ALWAYS at the borders (forms, API) : la seule place où l'exception compte.</li></ul>
<div class="keepnote">💡 Garde en tête : throw surface tôt (données douteuses), catch où tu PEUX agir. Une exception lancée là où elle n'est pas utile = bruit.</div>`,
s:`class SoldeError extends Error {}\nfunction retirer(c, m) {\n  if (m > c.solde) throw new SoldeError('Solde insuffisant');\n  c.solde -= m; return c.solde;\n}\ntry { console.log(retirer({ solde: 50 }, 100)); }\ncatch (e) { console.error(e.name, '→', e.message); }\nfinally { console.log('transaction enregistrée'); }`,
x:['throw + try/catch sur une donnée invalide','Personnaliser une erreur (class extends Error)','finally : un compteur de tentatives qui trace toujours','2 branches catch (instanceof) + fallback message']},
41:{t:`<div class="keepnote">🎯 Mini-projet J41–45 : une petite app complète chaque jour — la suite est la conséquence des 40 premiers jours.</div>
<h3>0. Cadrage académique (10 min avant de coder)</h3>
<p>D'après la méthode d'analyse des systèmes d'information (Merise, modèle fonctionnel des flux) : avant toute application, déterminer <b>qui échange quoi avec qui</b>, puis les <b>règles de gestion</b>, puis les fonctions. Pour chaque projet de la semaine, écris en commentaire : 1 ligne « acteurs + données », 1 règle de gestion clé (ex. « un retrait ne peut excéder le solde »), et la liste des fonctions prévues. Tu produis comme un analyste, pas comme un tappeur.</p>
<h3>Projet J41 : « Compteur de jours »</h3>
<p>Un petit utilitaire console : entrer une date cible et afficher le nombre de jours restants. En 4 étapes :</p>
<ol><li>Définir la date cible (objet Date, parse ISO).</li>
<li>Calculer la différence de jours (Math.floor, 86 400 000 ms = 1 jour).</li>
<li>Rendre le rapport (template literals + conditions « aujourd'hui / demain / dans X jours »).</li>
<li>Des fonctions à une responsabilité : <code>joursRestants(dateCible)</code>, <code>formateCompte(jours)</code>.</li></ol>
<h3>Ce que ce TP fait travailler</h3>
<ul><li>Objet Date : <code>new Date('2026-01-01')</code>, <code>getTime()</code></li>
<li>Math.floor(a / b) / %, ceil()</li>
<li>Conditions multiples + ternaire chaîné sobres</li></ul>

46:{t:`<div class="keepnote">🎯 Le DOM : ton JS touche à l'écran. À partir d'aujourd'hui, le code change ce qu'on VOIT.</div>
<h3>1. Le DOM est un arbre vivant</h3>
<pre><code>document                    → racine
 └─ html → head, body
       └─ div#app
            └─ button  …</code></pre>
<p>Modifier l'arbre = modifier l'écran, instantanément, sans recharger.</p>
<h3>2. Les 3 sélecteurs du quotidien</h3>
<pre><code>document.querySelector('#app')        // 1er correspondant (CSS style)
document.querySelectorAll('.task')   // NodeList → tableau via [...liste] → [...list]
document.getElementById('app')       // l'ancien rapide</code></pre>
<p>Toutes les APIs de traversal : <code>el.closest(sel)</code>, <code>el.parentElement</code>, <code>el.children</code>.</p>
<h3>3. Lire et écrire</h3>
<pre><code>el.textContent = 'texte brut'           // sécuritaire (HTML échappé)
el.innerHTML = '&lt;b&gt;gras&lt;/b&gt;'           // position dangerous : HTML exécuté
el.value = 'x' / el.style.color / el.classList</code></pre>
<h3>4. Créer et brancher</h3>
<pre><code>const d = document.createElement('div');
d.textContent = 'bonjour';
document.querySelector('#app').append(d);</code></pre>
<div class="keepnote">⚠️ innerHTML n'accueille JAMAIS une donnée utilisateur (XSS — jour 151). textContent, oui. Cette règle sauve des comptes.</div>`,
s:`<h2 id="titre">Hello</h2>\n<script>\n  const h = document.querySelector('#titre');\n  h.textContent = 'Hello — changé depuis JS';\n  h.style.color = 'steelblue';\n<\/script>`,
x:['La différence textContent vs innerHTML sur un &lt;script&gt; injecté','Créer une carte complète (createElement + append) en 1 clic','closest() : un clic qui trouve son parent bouton','querySelectorAll + for…of sur ce même panneau']},
47:{t:`<div class="keepnote">🎯 Événements : le dialogue de l'écran. addEventListener est le verbe du programmeur interactif.</div>
<h3>1. Le duo addEL/removeEL</h3>
<pre><code>el.addEventListener('click', (e) =&gt; {…});
// noms clés : click, input, submit, keydown, change, mouseenter, scroll, resize</code></pre>
<ul><li>Un handler reçoit un objet <b>event</b> : <code>e.target</code>, <code>e.key</code>, <code>e.clientX</code>, <code>e.preventDefault()</code>.</li>
<li>onclick = un seul handler; addEventListener = plusieurs. C'EST la façon pro.</li></ul>
<h3>2. Bubbling : l'événement remonte</h3>
<pre><code>liste.addEventListener('click', e =&gt; {
  const li = e.target.closest('li');   // délégation ! un listener pour mille éléments
});</code></pre>
<h3>3. preventDefault : quand on écrase le comportement natif</h3>
<pre><code>form.addEventListener('submit', e =&gt; { e.preventDefault(); });</code></pre>
<div class="keepnote">💡 Garde en tête : la <b>délégation</b> est LA pattern des listes dynamiques. Un seul listener sur le parent = tu écoutes tout, même les éléments créés après.</div>
<h3>4. Keyboard</h3>
<pre><code>input.addEventListener('keydown', e =&gt; { if (e.key === 'Enter') envoyer(); });</code></pre>`,
s:`<ul id="liste">\n  <li>HTML</li><li>CSS</li><li>JS</li>\n</ul>\n<script>\n  document.querySelector('#liste').addEventListener('click', e => {\n    const li = e.target.closest('li');\n    if (li) li.classList.toggle('actif');\n  });\n<\/script>\n<style>.actif { background: lavender; }</style>`,
x:['La délégation sur une liste (tous éléments par 1 listener)','Un formulaire qui refuse le submit natif (preventDefault + log)','keydown Enter → Focus/anne','Un compteur de clics sur un bouton (mutation du texte)']},
48:{t:`<div class="keepnote">🎯 Formulaires DOM : Lecture de FormData + validation — l'utilisateur est le POINT faible SCRUPULE de toute app réelle.</div>
<h3>1. La lecture propre : FormData</h3>
<pre><code>form.addEventListener('submit', e =&gt; {
  e.preventDefault();
  const d = new FormData(e.target);        // tous les champs de la page (name!)
  const data = Object.fromEntries(d);      // { nom: '…', mail: '…' }
});</code></pre>
<p>Le <b>name</b> de chaque input est la clé du POST. Sans name → donnée perdue.</p>
<h3>2. Validation d'abord HTML, re-en JS</h3>
<ul><li>Les attributs natifs (required, email, min) requièrent le contrôle avant submit.</li>
<li>JS vérifie une deuxième fois : <code>form.checkValidity()</code> ou la regex spécifique.</li>
<li>Message d'erreur dans l'écran, pas seulement en console.</li></ul>
<h3>3. Le vide comme règle d'art : On garde l'utilisateur au courant</h3>
<pre><code>afficheErreur(inputEl, 'Adresse email invalide');   // message près du champ
form.reset();  // Only after successful submit</code></pre>
<div class="keepnote">💡 Garde en tête : ne JAMAIS faire confiance au client : la validation front est une expérience user, pas une sécurité (rappel au jour 100).. Chez toi, quand le DOM est modifiable, tout est truquable.</div>`,
s:`<form id="f">\n  <input name="nom" required placeholder="nom">\n  <input name="mail" type="email" required placeholder="email">\n  <button>Envoyer</button>\n  <p id="msg"></p>\n</form>\n<script>\n  document.querySelector('#f').addEventListener('submit', e => {\n    e.preventDefault();\n    const d = Object.fromEntries(new FormData(e.target));\n    document.querySelector('#msg').textContent = 'Reçu : ' + d.nom + ' <' + d.mail + '>';\n  });\n<\/script>`,
x:['Form 3 champs → FormData → affiché dans la page','Validation longue : minimum 3 caractères + message','Un placeholder + label liés (rappel du jour 5)','reset() après success + toast console']},
49:{t:`<div class="keepnote">🎯 LocalStorage : la mémoire entre les visites. C'est elle qui fait des web apps des apps persistentes.</div>
<h3>1. L'API 3-lignes</h3>
<pre><code>localStorage.setItem('k', 'valeur');       // texte only (!)
localStorage.getItem('k');                  // string ou null
localStorage.removeItem('k');
JSON.stringify(obj) / JSON.parse(obj)      // dans les 2 sens</code></pre>
<h3>2. La bonne pratique : un seul clé par app</h3>
<pre><code>const K = 'todo.v1';
function sauver(state) { localStorage.setItem(K, JSON.stringify(state)); }
function charger() { return JSON.parse(localStorage.getItem(K) || 'null') ?? { taches: [] }; }</code></pre>
<ul><li>try/catch sur parse : un JSON corrompu ne doit pas briser l'app.</li>
<li>localStorage synchronique (bloque) et limité (~5 Mo). Asynchrone et gros → IndexedDB (plus tard).</li></ul>
<h3>3. La différence avec les cookies</h3>
<ul><li>Cookie : partagent le serveur automatiquement (qui a sa function).</li>
<li>localStorage : purement client, aucun envoi réseau — c'est TOI qui synchronises (raison pour quoi cette plateforme le fait manuellement !).</li></ul>
<div class="keepnote">💡 Garde en tête : localStorage = <b>cache local vivant pendant la session offline-first</b>. Le jour 2 elle mélange la progression et le code grâce à cette même API construite en v2 clé.</div>`,
s:`const K = 'note.v1';\nconst noteIn = document.querySelector('#nIn'), out = document.querySelector('#pre');\nfunction save(t) { localStorage.setItem(K, t); } // ← compléte par read + render\n<p>\n  <input id="nIn" placeholder="note" />\n  <button onclick="save(document.querySelector('#nIn').value || 'vide')">Save</button>\n</p>\n<pre id="pre"></pre>`,
x:['setItem / getItem sur un champ de note (persistance après refresh)','JSON round-trip d\'un objet à 3 clés','Un JSON corrompu : try/catch + fallback {}']},
50:{t:`<div class="keepnote">🎯 Fetch : la passerelle vers API. Aujourd'hui, retiens : fetch renvoie une PROMISE — donc le jour 38/39 déjà t'est parvenu.</div>
<h3>1. Read (GET)</h3>
<pre><code>const r = await fetch('https://api.github.com/users/emmanuel/repos');
if (!r.ok) throw new Error('HTTP ' + r.status);           // fetch NE rejette PAS les 4xx !
const data = await r.json();</code></pre>
<h3>2. Write (POST)</h3>
<pre><code>await fetch(url, {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ titre: 'bonjour' })
});</code></pre>
<h3>3. Ce que tu dois RETENIR absolument</h3>
<ul><li><code>fetch</code> resolve même en 404/500. vérifier <code>r.ok</code> — piège n°1 des débutants.</li>
<li><code>r.json()</code> est aussi un a wait : le body est une promesse (readable stream).</li>
<li>CORS : le serveur doit y autoriser (basé sur l'En-tête).</li></ul>
<div class="keepnote">💡 Garde en tête : les trois étapes de chaque fetch : fetch → check r.ok → r.json(). Considère sur l'API JSONPlaceholder ou GitHub : lisible sans clé.</div>`,
s:`async function chargeRepo() {\n  try {\n    const r = await fetch('https://api.github.com/users/octocat/repos?per_page=3');\n    if (!r.ok) throw new Error('HTTP ' + r.status);\n    const d = await r.json();\n    console.table(d.map(x => ({ nom: x.name, ★: x.stargazers_count })));\n  } catch (e) { console.error('fetch raté:', e.message); }\n}\nchargeRepo();  // cette API est réelle — teste !`,
x:['fetch GET + check r.ok + json sur une API publique','POST sur jsonplaceholder + log du résultat','Un r.status vérifié une erreur 404 intentionnelle','2 fetches parallèles (Promise.all) — rappel du J39']},
51:{t:`<h3>Projet J51 : « Liste de tâches » (le rituel : jour 1 de tout développeur)</h3>

t:`<div class="keepnote">🎯 React : le framework orienté composant. On voit aujourd'hui CE POURQUOI le framework existe. (C'est aussi la partie où ton terminal devient ton poste de travail.)</div>
<h3>1. Ce que React résout</h3>
<p>En vanilla, tu gères l'état ET le rendu manuellement (attach/détach éléments, listeners dupliqués, sync des textes). React automatise LE RENDU déclaratif : tu décrits la vue selon l'état, React se colletine le recalcul.</p>
<h3>2. L'installation</h3>
<p>Aujourd'hui, pas d'éditeur web : le React vit hors navigateur. Deux voies :</p>
<ol><li><b>Vite</b> (le net outil moderne) : <code>npm create vite@latest mon-app -- --template react</code> → <code>cd mon-app && npm i && npm run dev</code>.</li>
<li>Un éditeur online type StackBlitz/Codesandbox pour les jours sans PC fixe.</li></ol>
<h3>3. JSX : l'HTML rédigé par JS</h3>
<pre><code>const el = &lt;h1 className="titre"&gt;Bonjour {nom}&lt;/h1&gt;;   {/* JSX compile */}</code></pre>
<ul><li><code>class</code> → <code>className</code> (mot réservé JS)</li>
<li><code>{expr}</code> = fenêtre dynamique</li>
<li>Un seul élément racine par composant (fragments &lt;&gt;&lt;/&gt;).</li></ul>
<div class="keepnote">💡 Garde en tête : les fichiers JSX vivent dans <code>src/components/</code>. Fais cc : d'ici 5 jours, tu rends React fichier par fichier comme les autres gens — avec composants réutilisés, pas d'innovation à inventer.</div>`,

57:{t:`<h3>Composants : les briques</h3>
<p>Un composant React = une fonction qui retourne du JSX. C'est TOUT.</p>
<pre><code>function Magnet({ jour, titre }) {
  return &lt;div className="magnet"&gt;&lt;b&gt;J{jour}&lt;/b&gt;&lt;span&gt;{titre}&lt;/span&gt;&lt;/div&gt;;
}
function Tableau() {
  return &lt;div&gt;
      &lt;Magnet jour={1} titre="HTML" /&gt;
      &lt;Magnet jour={2} titre="CSS" /&gt;
    &lt;/div&gt;;
}</code></pre>
<h3>Règles d'or</h3>
<ul><li><b>PascalCase</b> nommage (Magnet, pas magnet).</li>
<li>Props : les <b>paramètres</b> du composant (objet unique — déstructuring, J35).</li>
<li>Composant petit et pure : pas de mutation, pas de Requête hors cycle.</li></ul>
<h3>Le fichier App.jsx = ton morceau ROOT</h3>
<pre><code>export default function App() { return &lt;Tableau /&gt; }</code></pre>
<div class="keepnote">💡 Garde en tête : si tu pointe vers &copy; un HTML &lt;div class&gt; — React want className. 3 sorties de vue : className, style={{…}} (camélcasé CSS), htmlFor.</div>`,
s:`function Magnet({ jour, titre }) {\n  return <div className="magnet"><b>J{jour}</b> {titre}</div>;\n}\nfunction App() {\n  return (\n    <>\n      <Magnet jour={1} titre="HTML" />\n      <Magnet jour={2} titre="CSS" />\n    </>\n  );\n}`,
x:['Créer 2 composants + 1 liste + 1 map props','Méthode pour rendre une map (keys, la réflexion J64)','Nesting / composition : Magnet dans Colonne dans Tableau','Modifier props live (vite HMR montre le re-render instant)']},
58:{t:`<h3>Props en profondeur : input/output de composants</h3>
<pre><code>&lt;Carte titre="Bienvenue" contenu="…" estGrande /&gt;   {/* un booléen sans juste value */}
function Carte({ titre, contenu, estGrande, children }) {  ... }  /* children = l'enfant */</code></pre>
<ul><li>Props READ ONLY : un composant ne modifie jamais ses props (les prop utils vers parent bureaucratie callback).</li>
<li>children : tout le contenu entre &lt;Composant&gt;…&lt;/Composant&gt; — la composition majeurs.</li>
<li>defaultProps → syntaxe paramètres défaut (destructuring).</li></ul>
<h3>Communication remontante (règle propriétaire)</h3>
<pre><code>function Parent() {
  return &lt;Filtre onPick={v =&gt; console.log(v)} /&gt;;
}
function Filtre({ onPick }) { return &lt;button onClick={() =&gt; onPick('vert')} /&gt;; }</code></pre>
<div class="keepnote">💡 Garde en tête : un flux unidirectionnel : props descendent, events remontent. Toute l'architecture React repose sur cette règle d'arrosage.</div>`,
s:`function Carte({ titre, children, grande }) {\n  return <div className={grande ? 'card big' : 'card'}>\n    <h3>{titre}</h3>\n    {children}\n  </div>;\n}\nfunction App() {\n  return <Carte titre="Accueil" grande><p>Contenu injecté depuis App.</p></Carte>;\n}`,

59:{t:`<h3>State : la mémoire du composant</h3>
<pre><code>import { useState } from 'react';
function Compteur() {
  const [n, setN] = useState(0);
  return &lt;button onClick={() =&gt; setN(n + 1)}&gt;Cliqué {n}×&lt;/button&gt;;
}</code></pre>
<ul><li><code>useState(0)</code> renvoie un couple [valeur, setterinstanc] destructuré.</li>
<li>Setter = file un render. <b> onChange reçoisiValue</b> : setN(n => n + 1) est le SAFE quand n est dans une factory.</li>
<li>Les state locaux disparaissent avec le composant : rien ne persiste ici.</li></ul>
<div class="keepnote">💡 Garde en tête : useState = LE remplacement des <code>variables du composant vanilla</code>. Deux updates sans les batchers = re-render double ; React compile ça moderne : batch par défaut.</div>`,

60:{t:`<h3>Projet J60 : Mini-app React « Tableau d'aimants » v0 (votre 1er composant d'état complet)</h3>
<p>De la vanilla (J51) vers le composant React, en 3 étapes :</p>
<ol><li><code>&lt;App&gt;</code> state <code>{ jours: [...nom...] }</code> + rendu <code>Carte jour</code>.</li>
<li><code>Cocher(n)</code> : state immuable (<code>.map((j, i) =&gt; i === n ? { ...j, fait: true } : j</code>), jamais push direct.</li>
<li>Barre de progression : derive d'état (<code>jours.filter(j =&gt; j.fait).length</code> calculé au render — jamais manual sync !).</li></ol>
<h3>Ce que ce TP fait travailler</h3>
<ul><li>L'immuabilité (J36 : spread ne mute pas) — là donner d'OR React.</li>
<li>Derivatives state = moins de state à maintenir (principe LEAR)</li>
<li>Composition complète (Tableau → Carte → Badge)</li></ul>
<div class="keepnote">🎉 J60 · 33 % du parcours. Tu es passer de « scripteur de page » à « constructeur d'app composants ». Les jours 61–90 font Reactogenic (hooks, routing…) — le même disc plus industrialisé. Congratulation sur ton mois : prenez une vrai pause, pose ton aimant, ouvre demain nouveau chapitre.</div>`,

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const today = () => new Date().toLocaleDateString('sv'); // YYYY-MM-DD

const CONFIG = window.PBD_CONFIG || { url: '', key: '' };
const K = 'pbd.state.v2';       // { progress:{n:date}, pending:{n:{date,ts}} }

/* ---------------- thème (clair / sombre / système) ---------------- */
const Theme = {
  set(mode) {
    localStorage.setItem('pbd.theme', mode);
    const h = document.documentElement;
    h.setAttribute('data-theme', mode === 'dark' ? 'dark' : mode === 'light' ? 'light' : 'system');
    $$('.theme-pop button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.t === mode)));
  },
  init() {
    this.set(localStorage.getItem('pbd.theme') || 'system');
    $$('.theme-toggle').forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        const pop = btn.parentElement.querySelector('.theme-pop');
        pop.classList.toggle('open');
      };
    });
    document.addEventListener('click', () => $$('.theme-pop').forEach(p => p.classList.remove('open')));
    $$('.theme-pop button').forEach(b => b.onclick = () => Theme.set(b.dataset.t));
  }
};

// clés normalisées (sans sélecteur de variation), triées du plus long au plus court
// (une séquence ZWJ comme 👨🏾‍💻 doit être remplacée AVANT 💻)
const ICONS_N = Object.entries(ICONS)
  .map(([k, v]) => [k.replace(/\uFE0F/g, ''), v])
  .sort((a, b) => [...b[0]].length - [...a[0]].length);
// applique les remplacements emoji → SVG, sans toucher aux <svg> existants
function iconify(html) {
  if (typeof html !== 'string' || !html) return html;
  return html.split(/(<svg[\s\S]*?<\/svg>)/g).map(seg => {
    if (seg.startsWith('<svg')) return seg;
    let out = seg.replace(/\uFE0F/g, '');
    for (const [em, svg] of ICONS_N) {
      if (out.includes(em)) out = out.split(em).join(svg);
    }
    return out;
  }).join('');
}

/* ---------------- helpers UI ---------------- */
let toastTimer;
function toast(msg) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.innerHTML = iconify(msg);
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}
function confetti() {
  const box = document.createElement('div'); box.className = 'confetti';
  const colors = ['var(--mint-strong)', 'var(--peach-strong)', 'var(--brand)', 'var(--butter)', 'var(--sky)'];
  for (let i = 0; i < 26; i++) {
    const p = document.createElement('i');
    p.style.left = '50vw'; p.style.top = '30vh';
    p.style.background = colors[i % colors.length];
    p.style.setProperty('--dx', ((Math.random() - .5) * 60) + 'vw');
    p.style.setProperty('--dy', (-(Math.random() * 30) + 30 + 'vh'));
    p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    p.style.animationDelay = (Math.random() * .18) + 's';
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 1200);
}
function countUp(el, goal, suf) {
  const start = performance.now(), dur = 700;
  const from = 0;
  function step(t) {
    const k = Math.min(1, (t - start) / dur), v = Math.round(from + (goal - from) * (1 - Math.pow(1 - k, 3)));
    el.textContent = v + (suf || '');
    if (k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------------- Store : progression + code, local-first ---------------- */
const Store = {
  progress: {}, pending: {}, code: {}, user: null, sb: null,

  load() {
    try {
      const raw = JSON.parse(localStorage.getItem(K) || '{}');
      this.progress = raw.progress || {};
      this.pending = raw.pending || {};
    } catch { this.progress = {}; this.pending = {}; }
    try { this.code = JSON.parse(localStorage.getItem(KC) || '{}'); } catch { this.code = {}; }
    // migration de l'ancien format
    if (!Object.keys(this.progress).length) {
      try {
        const old = JSON.parse(localStorage.getItem(KOLD) || '{}');
        for (const n in old) this.progress[n] = old[n];
      } catch {}
    }
    if (!Object.keys(this.code).length) {
      try {
        for (let i = 0; i < 200; i++) {
          const c = localStorage.getItem(KCOLD + i);
          if (c) this.code[i] = c;
        }
      } catch {}
    }
    this.save();
  },
  save() { try { localStorage.setItem(K, JSON.stringify({ progress: this.progress, pending: this.pending })); } catch { /* navigateur très restreint : progression gardée en mémoire */ } },
  saveCode() { try { localStorage.setItem(KC, JSON.stringify(this.code)); } catch {} },

  maxDone() { return Math.max(0, ...Object.keys(this.progress).map(Number)); },

  status(n) {
    if (this.progress[n]) return 'done';
    const m = this.maxDone();
    if (n > m + 1) return 'locked';
    return this.progress[m] >= today() ? 'wait' : 'open';
  },

  streak() {
    // nombre de jours consécutifs (calendaires) validés, en partant du plus récent
    const dates = Object.values(this.progress);
    if (!dates.length) return 0;
    const set = new Set(dates);
    let s = 0;
    const d = new Date(set.has(today()) ? today() : new Date(Date.now() - 864e5).toLocaleDateString('sv'));
    for (; set.has(d.toLocaleDateString('sv')); ) {
      s++;
      d.setDate(d.getDate() - 1);
    }
    return s;
  },

  setCode(n, code) { this.code[n] = code; this.saveCode(); },

  /* Validation du jour n — locale d'abord, sync si possible */
  validate(n) {
    if (this.progress[n]) return { ok: true };
    this.progress[n] = today();
    this.pending[n] = { date: today(), ts: Date.now() };
    this.save();
    const pushed = Sync.pushSoon(true);
    return { ok: true, pushed };
  }
};

/* ---------------- Sync : Supabase + file d'attente hors ligne ---------------- */
const Sync = {
  online: navigator.onLine,
  state: 'local', // local | syncing | synced | error

  async init() {
    this.online = navigator.onLine;
    window.addEventListener('online', () => { this.online = true; this.refreshBadge(); this.pushSoon(); });
    window.addEventListener('offline', () => { this.online = false; this.refreshBadge(); });
    if (!CONFIG.url || !CONFIG.key) { this.refreshBadge(); return; }
    if (window.supabase) {
      try {
        this.sb = window.supabase.createClient(CONFIG.url, CONFIG.key, {
          auth: { persistSession: true, autoRefreshToken: true }
        });
        const { data } = await this.sb.auth.getSession();
        Store.user = data?.session?.user || null;
        if (Store.user) await this.pull();
      } catch (e) { console.warn('[sync]', e); }
    }
    this.sb?.auth.onAuthStateChange((_ev, session) => {
      const was = Store.user;
      Store.user = session?.user || null;
      if (Store.user && !was) this.pull().then(() => this.pushSoon());
      renderAuth();
    });
    this.refreshBadge();
  },

  refreshBadge() {
    const els = $$('.sync-badge');
    let mode = 'local', label = 'Local uniquement';
    if (!Store.user) {
      if (!navigator.onLine) { mode = 'offline'; label = 'Hors ligne · local'; }
      else if (!CONFIG.url) { mode = 'nocfg'; label = 'Local · config compte à venir'; }
    } else {
      if (this.state === 'syncing') { mode = 'syncing'; label = 'Synchro…'; }
      else if (!navigator.onLine) { mode = 'offline'; label = 'Hors ligne · file en attente'; }
      else if (Object.keys(Store.pending).length) { mode = 'syncing'; label = 'File en attente…'; }
      else { mode = 'online'; label = 'Compte synchronisé'; }
    }
    els.forEach(el => {
      const dot = el.querySelector('.sync-dot');
      dot.className = 'sync-dot ' + mode;
      el.title = label;
      const txt = el.querySelector('.sync-txt');
      if (txt) txt.textContent = label;
      if (el.dataset.who === 'chip') el.textContent = Store.user ? (Store.user.email.split('@')[0]) : label;
    });
    const a = $('#syncLabel'); if (a) a.textContent = label;
  },

  /* Pusher la file d'attente vers le compte */
  async pushSoon(force) {
    if (!Store.user || !this.sb || !navigator.onLine) { this.refreshBadge(); return false; }
    const ids = Object.keys(Store.pending);
    if (!ids.length) { this.refreshBadge(); return true; }
    this.state = 'syncing'; this.refreshBadge();
    try {
      const rows = ids.map(n => ({
        user_id: Store.user.id,
        day: Number(n),
        completed_date: Store.pending[n].date,
        code: Store.code[n] || null,
        updated_at: new Date(Store.pending[n].ts).toISOString()
      }));
      const { error } = await this.sb
        .from('day_progress')
        .upsert(rows, { onConflict: 'user_id,day' });
      if (error) throw error;
      ids.forEach(n => delete Store.pending[n]);
      Store.save();
      this.state = 'synced'; this.refreshBadge();
      return true;
    } catch (e) {
      this.state = 'error'; this.refreshBadge();
      if (!force) console.warn('[push]', e);
      return false;
    }
  },

  /* Récupérer la progression du compte et fusionner (le serveur gagne, la file locale part ensuite) */
  async pull() {
    if (!Store.user || !this.sb) return;
    try {
      const { data, error } = await this.sb.from('day_progress')
        .select('day,completed_date,code,updated_at')
        .eq('user_id', Store.user.id);
      if (error) throw error;
      let changed = false;
      (data || []).forEach(r => {
        const n = r.day;
        const local = Store.progress[n];
        const isPending = Store.pending[n];
        if (!isPending && (!local || (r.completed_date >= local))) {
          if (r.completed_date !== local) { Store.progress[n] = r.completed_date; changed = true; }
        }
        if (r.code && Store.code[n] === undefined) { Store.code[n] = r.code; }
      });
      if (changed || Object.keys(Store.code).length) Store.saveCode();
      Store.save();
      if (Object.keys(Store.pending).length) await this.pushSoon();
      this.state = 'synced';
    } catch (e) { console.warn('[pull]', e); this.state = 'error'; }
    this.refreshBadge();
  },

  /* Authentification */
  async signIn(email, pass) {
    const { data, error } = await this.sb.auth.signInWithPassword({ email, password: pass });
    if (error) throw error;
    Store.user = data.user;
    await this.pull();
    await this.pushSoon(); // pousser la progression locale faite hors compte
    this.refreshBadge();
    return data.user;
  },
  async signInOAuth(provider) {
    if (!this.sb) throw new Error('Backend non configuré (config.js).');
    const base = location.href.replace(/[^/]*$/, ''); // dossier de la page
    const { error } = await this.sb.auth.signInWithOAuth({
      provider,
      options: { redirectTo: base + 'login.html' }
    });
    if (error) throw error;
    // la page va être redirigée vers le fournisseur ; le retour passera par redirectTo
  },
  async signUp(email, pass) {
    const { data, error } = await this.sb.auth.signUp({ email, password: pass });
    if (error) throw error;
    // Selon la config du projet Supabase, la session peut être immédiate ou nécessiter une confirmation email
    Store.user = data.user || null;
    if (Store.user) { await this.pull(); await this.pushSoon(); }
    this.refreshBadge();
    return data;
  },
  async signOut() {
    await this.sb?.auth.signOut();
    Store.user = null;
    this.refreshBadge();
    renderAuth();
  }
};

/* ---------------- chip d'authentification partagée ----------------
   Même rendu sur toutes les pages : badge de sync + chip compte.
   L'accueil expose en plus #goBoard (retour direct au tableau une fois connecté). */
/* chip de compte : pastille photo de profil + prénom (metadata OAuth) */
function firstNameOf(user) {
  const m = user.user_metadata || {};
  const full = String(m.full_name || m.name || '').trim();
  if (full) return full.split(/\s+/)[0];
  return String(m.preferred_username || m.user_name || user.email || '').split('@')[0].split(/\s+/)[0];
}
function avatarOf(user) {
  const m = user.user_metadata || {};
  return m.avatar_url || m.picture || '';
}
function renderAuth() {
  const ta = $('#topbarAuth');
  if (ta) {
    if (Store.user) {
      const name = firstNameOf(Store.user);
      const url = avatarOf(Store.user);
      const ava = url
        ? `<img class="ava" src="${url}" width="22" height="22" alt="" referrerpolicy="no-referrer">`
        : `<span class="ava ava-letter">${(name[0] || '?').toUpperCase()}</span>`;
      ta.innerHTML = `<a class="chip-btn small auth-me" href="login.html" title="Ton compte — ${Store.user.email}">${ava}<b>${name}</b></a>`;
    } else {
      ta.innerHTML = `<a class="chip-btn small" href="login.html">Connexion</a>`;
    }
  }
  const go = $('#goBoard');
  if (go) go.hidden = !Store.user;
  Sync.refreshBadge();
}

/* ---------------- Démarrage commun ---------------- */
async function bootCommon() {
  Store.load();
  Theme.init();
  document.documentElement.classList.add('js');
  await Sync.init();
  renderAuth();
  /* bouton retour hors de la TopBar (toutes les pages sauf l'accueil) */
  const path = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
  if (path !== 'index.html' && path !== '' && path !== 'index') {
    const header = document.querySelector('header.topbar');
    if (header && !document.getElementById('backBar')) {
      const bar = document.createElement('div');
      bar.id = 'backBar';
      bar.className = 'back-bar';
      bar.innerHTML = '<button class="chip-btn small" type="button" onclick="if (history.length > 1) history.back(); else location.href=\'index.html\';" aria-label="Retour">← Retour</button>';
      header.insertAdjacentElement('afterend', bar);
    }
  }
}

// Icônes en ligne (mini-jeux d'emoji SVG inline, légers)
const ICON = {
  done: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`,
  lock: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`,
  run: `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>`,
  moon: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>`,
  sun: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>`,
  auto: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg>`
};

<script id="standaloneApp" data-src="standalone-src.js">
// standalone-src.js — moteur SPA de la version « fichier unique » hors ligne
// (inlined par build-standalone.js dans dist/shift180-hors-ligne.html ; toutes les pages y vivent en une seule)
/* eslint-env browser */

const WEB_AWARE = n => n <= 18 || (n >= 46 && n <= 55);
const LABS = { done: '✓ Terminé', open: 'Poser ton aimant', wait: '⏳ Demain', locked: 'Verrouillé' };
const HOOK = `<script>const _p=(t,a)=>parent.postMessage({t,m:a.map(x=>typeof x=='object'?JSON.stringify(x):String(x)).join(' ')},'*');
console.log=(...a)=>_p('log',a);console.error=(...a)=>_p('err',a);
onerror=m=>_p('err',[m]);addEventListener('unhandledrejection',e=>_p('err',[e.reason]));<\/script>`;

/* lexique + figures (copie des helpers de day.js : le fichier est autonome) */
let glossRe2 = null;
function glossify(html) {
  if (!window.GLOSS) return html;
  if (!glossRe2) {
    const keys = Object.keys(GLOSS).filter(k => GLOSS[k]).sort((a, b) => b.length - a.length)
      .map(k => k.replace(/[.*+?^${}()|[\]\\/]/g, '\\$&'));
    glossRe2 = new RegExp(`(?<![A-Za-zÀ-ÿ])(${keys.join('|')})(?![A-Za-zÀ-ÿ])`);
  }
  const parts = html.split(/(<[^>]*>)/g);
  let skip = 0;
  return parts.map(seg => {
    if (seg.startsWith('<')) {
      const m = seg.match(/^<\/?([a-zA-Z]+)/);
      if (m) { const tag = m[1].toLowerCase(); if (['code', 'pre', 'a', 'dfn', 'button'].includes(tag)) skip += seg.startsWith('</') ? -1 : 1; }
      return seg;
    }
    if (skip > 0 || !seg.trim()) return seg;
    return seg.replace(glossRe2, w => {
      const k = Object.keys(GLOSS).find(x => x === w || x.toLowerCase() === w.toLowerCase());
      if (!k) return w;
      return `<button class="term" type="button" data-t="${k.replace(/"/g, '&quot;')}"><span>${w}</span><span class="term-def" hidden>${GLOSS[k]}</span></button>`;
    });
  }).join('');
}
function figHTML(id) {
  const f = FIGS && FIGS[id]; if (!f) return '';
  return `<figure class="fig"><div class="fig-art">${f.svg}</div><figcaption>${f.cap}</figcaption></figure>`;
}
function theoryHTML(les) {
  // le lexique s'applique au texte du cours SEUL, jamais aux SVG (un <button> dans <text> casse le SVG)
  let t = glossify(les.t);
  if (les.figs && les.figs.length) t += `<h3 class="figs-title">🖼️ Figures du jour</h3>` + les.figs.map(figHTML).join('');
  if (les.pc && les.pc.steps) {
    const figs = (les.pc.figs || []).map(figHTML).join('');
    t += `<details class="pconly">
      <summary>🖱️ ${les.pc.title || 'Actions à reproduire sur un ordinateur'}</summary>
      <p class="pcwhy">💾 Sur téléphone ou tablette tu peux tout suivre en lecture : ces actions demandent un vrai clavier / OS, elles attendent ta prochaine session PC.</p>
      ${figs}<ol class="pc-steps">${les.pc.steps.map(s => `<li>${s}</li>`).join('')}</ol>
      ${les.pc.note ? `<p class="pc-note">${les.pc.note}</p>` : ''}</details>`;
  }
  return iconify(t);   // emojis de l'interface → icônes SVG
}

/* ---------- rendu ---------- */
function monthDayStats(mi) {
  const [a, b] = MONTHS[mi - 1].range;
  let done = 0;
  for (let n = a; n <= b; n++) if (Store.progress[n]) done++;
  return { done, total: b - a + 1 };
}
let compactTimer2 = null, boardCompact2 = false;
function collapseBoard() {
  const cards = $$('#board .magnet'); const btn = $('#boardToggle');
  if (cards.length <= 7) { btn.hidden = true; return; }
  cards.slice(7).forEach(c => c.classList.add('minoring'));
  setTimeout(() => {
    cards.slice(7).forEach(c => { c.classList.add('minor'); c.classList.remove('minoring'); });
    btn.textContent = `⌄ Dérouler les ${cards.length} jours`;
    btn.hidden = false;
  }, 270);
  boardCompact2 = true;
}
function expandBoard() {
  sessionStorage.setItem('pbd.standaloneFull', '1');
  $$('#board .magnet.minor').forEach(c => c.classList.remove('minor'));
  $('#boardToggle').hidden = true;
  boardCompact2 = false;
}
function scheduleBoardCollapse() {
  const btn = $('#boardToggle'); if (!btn) return;
  clearTimeout(compactTimer2);
  const small = matchMedia('(max-width: 700px)').matches;
  const full = sessionStorage.getItem('pbd.standaloneFull') === '1';
  if (!small || full) { btn.hidden = true; return; }
  if (boardCompact2) { collapseBoard(); btn.hidden = false; return; }
  btn.hidden = true;
  compactTimer2 = setTimeout(collapseBoard, 3000);
  btn.onclick = expandBoard;
}

function renderDashboard() {
  $('#dayView').hidden = true;
  $('#tableau').hidden = false;
  window.scrollTo(0, 0);
  const saved = +localStorage.getItem('pbd.month') || 0;
  const firstOpen = DAYS.find(d => d && Store.status(d.n) !== 'locked');
  const cur = firstOpen ? MONTHS.findIndex(m => firstOpen.n >= m.range[0] && firstOpen.n <= m.range[1]) + 1 : 1;
  const selected = saved || cur;
  const m = MONTHS[selected - 1], [a, b] = m.range;
  const { done, total } = monthDayStats(selected);
  const { done: Dall } = { done: Object.keys(Store.progress).length };
  $('#boardTitle').textContent = `${m.title} (J${a}–${b})`;
  $('#boardSub').textContent = `${done}/${total} posés · ${Dall}/180 au total · file d'aide en haut du fichier`;
  $('#rail').innerHTML = MONTHS.map(mi => {
    const s = monthDayStats(mi.n);
    const active = mi.n === selected;
    return `<button class="month-tab" role="tab" aria-selected="${active}" data-m="${mi.n}">
      <b>Mois ${mi.n}</b><small>${mi.title}</small>
      <span class="month-mini"><i style="width:${s.done / s.total * 100}%"></i></span>
    </button>`;
  }).join('');
  $$('.month-tab').forEach(t => t.onclick = () => {
    localStorage.setItem('pbd.month', +t.dataset.m);
    renderDashboard();
  });
  $('#board').innerHTML = Array.from({ length: b - a + 1 }, (_, i) => {
    const n = a + i, D = DAYS[n], st = Store.status(n);
    return `<a class="magnet ${st}${st === 'open' ? ' today' : ''}" ${st === 'locked' ? 'aria-disabled="true"' : ''} data-d="${n}" href="#d=${n}">
      <span class="dnum">J${n}</span><span class="dtitle">${D.title}</span><span class="dbadge">${LABS[st]}</span></a>`;
  }).join('');
  $('#board').innerHTML = iconify($('#board').innerHTML);
  $$('#board .magnet').forEach(x => x.onclick = e => {
    e.preventDefault();
    openDay(+x.dataset.d);
  });
  scheduleBoardCollapse();
}

function openDay(n) {
  const st = Store.status(n);
  if (st === 'locked') { toast('Le Jour ' + n + ' s\'ouvrira après la validation du Jour ' + (n - 1) + '.'); return; }
  $('#tableau').hidden = true;
  $('#dayView').hidden = false;
  window.scrollTo(0, 0);
  const D = DAYS[n], les = (typeof LESSONS !== 'undefined' && LESSONS[n]) || generic(D);
  $('#dayTitle').textContent = 'Jour ' + n + ' — ' + D.title;
  $('#dayMeta').textContent = MONTHS.find(m => n >= m.range[0] && n <= m.range[1]).title;
  $('#theory').innerHTML = theoryHTML(les);

  $('#theory').addEventListener('click', e => {
    const b = e.target.closest('.term'); if (!b) return;
    const def = b.querySelector('.term-def');
    const open = def.hidden;
    $$('#theory .term-def').forEach(d => { if (d !== def) { d.hidden = true; d.parentElement.setAttribute('aria-expanded', 'false'); } });
    def.hidden = !open; b.classList.toggle('open', open);
  });

  /* TP */
  const savedTicks = JSON.parse(localStorage.getItem('pbd.tick.' + n) || '[]');
  $('#tasks').innerHTML = les.x.map((t, i) =>
    `<label class="task${savedTicks[i] ? ' checked' : ''}"><input type="checkbox" data-i="${i}"${savedTicks[i] ? ' checked' : ''}><span>${iconify(t)}</span></label>`).join('');

  /* éditeur */
  const ed = $('#ed'), con = $('#con'), fr = $('#fr');
  ed.value = Store.code[n] !== undefined ? Store.code[n] : String(les.s).replace(/\\n/g, '\n');
  fr.hidden = !WEB_AWARE(n);
  if (!WEB_AWARE(n)) $('#previewWrap').hidden = true; else $('#previewWrap').hidden = false;
  con.innerHTML = iconify('<span class="hint">Exécute ton code (▶) pour voir la sortie ici…</span>');
  window.onmessage = e => { if (e.source === fr.contentWindow) { const d = document.createElement('div'); d.textContent = (e.data.t === 'err' ? '✖ ' : '› ') + e.data.m; if (e.data.t === 'err') d.className = 'err'; con.appendChild(d); } };
  ed.onkeydown = e => {
    if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '  '); }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
  };
  const run = () => {
    Store.setCode(n, ed.value);
    con.innerHTML = '';
    fr.srcdoc = HOOK + (WEB_AWARE(n) ? ed.value : `<script>${ed.value}<\/script>`);
  };
  $('#run').onclick = run;
  $('#reset').onclick = () => { ed.value = les.s; Store.setCode(n, ''); con.innerHTML = '<span class="hint">Remis à zéro.</span>'; };
  ed.oninput = () => Store.setCode(n, ed.value);

  /* validation */
  const boxes = $$('#tasks input');
  const upd = () => {
    const tick = boxes.map(b => b.checked);
    try { localStorage.setItem('pbd.tick.' + n, JSON.stringify(tick)); } catch {}
    boxes.forEach(b => b.closest('.task').classList.toggle('checked', b.checked));
    const ok = $('#ok');
    const allDone = boxes.every(b => b.checked);
    ok.disabled = st === 'done' || !allDone;
    $('#okHint').textContent = st === 'done' ? '✓ déjà validé' : allDone ? 'Tous les TP cochés : pose ton aimant !' : `TP restants : ${boxes.filter(b => !b.checked).length}`;
  };
  boxes.forEach(b => b.onchange = upd);
  upd();
  const ok = $('#ok');
  ok.onclick = () => {
    Store.validate(n);
    ok.innerHTML = iconify('✓ Aimant posé !');
    try { confetti(); } catch {}
    toast('Leçon validée ✓ — progression gardée sur cet appareil.');
    setTimeout(renderDashboard, 700);
  };
}

/* ---------- boot ---------- */
async function bootStandalone() {
  document.documentElement.classList.add('js');
  Theme.init();
  Store.load();
  $('#back').onclick = renderDashboard;
  renderDashboard();
  // note capacité de sauvegarde
  try { localStorage.setItem('pbd.probe', '1'); localStorage.removeItem('pbd.probe'); }
  catch { toast('⚠️ Sur cet appareil, la progression ne peut pas être sauvegardée entre les sessions (navigateur restreint). Utilise le mode en ligne.'); }
}
bootStandalone();

</script>
