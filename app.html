<!DOCTYPE html>
<html lang="fr" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tableau de bord · Shift180</title>
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#fbf6ed">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="app.html">
        <img src="icons/logo.svg" alt="" width="34" height="34">
        <b>Shift180</b>
      </a>
      <span class="spacer"></span>
      <span id="topbarAuth"></span>
      <div class="theme-menu">
        <button class="chip-btn small theme-toggle" aria-haspopup="true" aria-label="Choisir le thème">
          <span id="themeIco"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg></span><span class="hide-s">Thème</span>
        </button>
        <div class="theme-pop" role="menu" aria-label="Thème">
          <button data-t="light" aria-checked="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg> Clair</button>
          <button data-t="dark" aria-checked="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg> Sombre</button>
          <button data-t="system" aria-checked="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg> Système</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero" aria-label="Progression">
      <div class="ring" id="ring" role="img" aria-label="Pourcentage des jours terminés">
        <svg viewBox="0 0 80 80">
          <circle class="track" cx="40" cy="40" r="35"/>
          <circle class="value" cx="40" cy="40" r="35"/>
        </svg>
        <b id="pct">0%</b>
      </div>
      <div class="hero-stats">
        <div class="stat"><b id="daysDone">0<sup>/180</sup></b><small>jours terminés</small></div>
        <div class="stat"><b id="streak">0</b><small>jours de suite <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22c4.4 0 7-2.8 7-6.5 0-3-1.8-5.2-3.5-7C14 7 13 5 13 2c-3 2-5.5 5-5.5 8.5 0-1-.5-2-1.5-3-1 1.7-3 4-3 8C3 19.2 7.6 22 12 22z"/></svg></small></div>
      </div>
      <div class="hero-cta">
        <button class="btn primary" id="continueBtn">Poser ton aimant</button>
      </div>
    </section>

    <div class="month-rail rise" id="rail" role="tablist" aria-label="Choisir le mois"></div>

    <div class="board-head">
      <h2 id="boardTitle"></h2>
      <small id="boardSub"></small>
    </div>

    <section class="board risense" id="board" aria-label="Jours du mois"></section>

    <div class="board-footnote">
      <button class="chip-btn small" id="boardToggle" hidden>⌄ Dérouler les 30 jours</button>
    </div>

    <p class="after-board"><span id="hint"></span></p>
  </main>

  <footer class="site-foot">
    <div class="container">Shift180 · <a href="index.html">À propos du projet</a> · <a href="credits.html">Crédits</a> · Créé par Emmanuel Jeancy BILOMBO-SILAHO, développeur congolais</div>
  </footer>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="lessons-d1-15.js"></script>
  <script src="lessons-d16-30.js"></script>
  <script src="lessons-d31-45.js"></script>
  <script src="lessons-d46-60.js"></script>
  <script src="data.js"></script>
  <script src="figures.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
  <script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { navigator.serviceWorker.register('sw.js').catch(()=>{}); }</script>
</body>
</html>
