<!DOCTYPE html>
<html lang="fr" data-theme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tableau · Shift180</title>
<link rel="icon" href="../icons/logo.svg" type="image/svg+xml">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#fbf6ed">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="app.html"><img src="../icons/logo.svg" alt="" width="34" height="34"><b>Shift180</b></a>
    <span class="spacer"></span>
    <button class="net-badge" id="netBadge" type="button" aria-live="polite"><span class="dot"></span><span id="netTxt">…</span></button>
    <span id="topbarAuth"></span>
  </div>
</header>

<div class="shell">
  <section id="lockPage" class="hidden">
    <div class="panel" style="text-align:center;margin-top:40px">
      <h2>🔒 Ce jour est encore verrouillé</h2>
      <p>Valide la leçon précédente pour ouvrir la suite, puis reviens demain.</p>
      <a class="btn btn-primary" href="app.html">Retour au tableau</a>
    </div>
  </section>

  <section id="board">
    <h1 style="margin:18px 0 6px">Ton tableau d'aimants 🧲</h1>
    <p id="streakLine" style="color:var(--muted);margin:0 0 8px"></p>
    <div class="dash">
      <aside class="stats" aria-label="Statistiques">
        <div class="stat"><b id="stDone">0</b><span>jours posés</span></div>
        <div class="stat"><b id="stStreak">0</b><span>série actuelle</span></div>
        <div class="stat"><b id="stPct">0 %</b><span>roadmap</span></div>
      </aside>
      <div>
        <div class="pills" id="monthPills" role="tablist" aria-label="Choisir le mois"></div>
        <div class="mgrid" id="monthGrid"></div>
        <p style="text-align:center;color:var(--muted);font-size:13px;margin-top:14px">
          ✅ posée · 🔓 en cours (pulse) · ⏳ en attente de date · 🔒 verrouillée</p>
      </div>
    </div>
  </section>
</div>

  <a href="login.html"><svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.7-9 6v2h18v-2c0-3.3-4-6-9-6z"/></svg>Compte</a>
</nav>

</html>
