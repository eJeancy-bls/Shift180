<!DOCTYPE html>
<html lang="fr" data-theme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tableau · Shift180</title>
<link rel="icon" href="../icons/logo.svg" type="image/svg+xml">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#fbf6ed">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="app.html"><img src="../icons/logo.svg" alt="" width="34" height="34"><b>Shift180</b></a>
    <span class="spacer"></span>
    <button class="net-badge" id="netBadge" type="button" aria-live="polite"><span class="dot"></span><span id="netTxt">…</span></button>
    <span id="topbarAuth"></span>
  </div>
</header>

<div class="shell">
  <section id="lockPage" class="hidden">
    <div class="panel" style="text-align:center;margin-top:40px">
      <h2>🔒 Ce jour est encore verrouillé</h2>
      <p>Valide la leçon précédente pour ouvrir la suite, puis reviens demain.</p>
      <a class="btn btn-primary" href="app.html">Retour au tableau</a>
    </div>
  </section>

  <section id="board">
    <h1 style="margin:22px 0 4px">Ton tableau d'aimants</h1>
    <p style="color:var(--ink-soft);margin:0 0 14px" id="streakLine"></p>
    <div class="hero-line">
      <svg class="ring" viewBox="0 0 44 44" id="srRing" aria-hidden="true">
        <circle cx="22" cy="22" r="18" fill="none" stroke="var(--board)" stroke-width="6"/>
        <circle id="srRingVal" cx="22" cy="22" r="18" fill="none" stroke="var(--brand)" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 113" transform="rotate(-90 22 22)" style="transition:stroke-dasharray .6s var(--ease)"/>
      </svg>
      <div class="counters" id="stCounters"></div>
    </div>
    <div class="board-wrap">
      <div class="pills" id="monthPills" role="tablist" aria-label="Choisir le mois" style="margin-bottom:14px"></div>
      <div class="path" id="monthGrid"></div>
    </div>
    <p style="display:flex;gap:16px;justify-content:center;color:var(--ink-soft);font-size:12.5px;font-weight:600;margin-top:14px;flex-wrap:wrap">
      <span>aimant posé <i class="dot" style="display:inline-block;width:10px;height:10px;border-radius:4px;background:var(--mint)"></i></span>
      <span>à faire <i style="display:inline-block;width:10px;height:10px;border-radius:4px;background:var(--peach)"></i></span>
      <span>pause <i style="display:inline-block;width:10px;height:10px;border-radius:4px;background:var(--butter)"></i></span>
      <span>à venir <i style="display:inline-block;width:10px;height:10px;border-radius:4px;background:transparent;border:1.5px dashed var(--ink-soft)"></i></span>
    </p>
  </section>
</div>

<nav class="bnav" aria-label="Navigation principale">
  <a href="app.html" aria-current="page"><span data-icon="home" data-size="24"></span>Tableau</a>
  <a href="day.html"><span data-icon="book-open" data-size="24"></span>Leçon</a>
  <a href="login.html"><span data-icon="user-round" data-size="24"></span>Compte</a>
</nav>

<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../data.js"></script>
<script src="../lessons-d1-15.js"></script>
<script src="../lessons-d16-30.js"></script>
<script src="../lessons-d31-45.js"></script>
<script src="../lessons-d46-60.js"></script>
<script src="../figures.js"></script>
<script src="../videos.js"></script>
<script src="../core.js"></script>
<script src="icons.js?v=3"></script>
<script src="../install.js"></script>
<script src="app.js?v=3"></script>
</body>
</html>
